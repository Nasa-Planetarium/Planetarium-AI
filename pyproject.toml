[project]
name = "planetarium"
version = "0.1.0"
description = "Team Planetarium - NASA Space Apps 2026: MODIS/VIIRS hotspot harmonization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.17.0",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "polars>=1.20",
    "pyarrow>=18",
    "pyhdf>=0.11.7",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
    "shapely>=2.0",
    "tqdm>=4.66",
    "tzdata>=2026.6",
    "xgboost>=3.0",
]

[project.optional-dependencies]
# FireOutlook Planner 지역 월 건수 후보 AutoETS·AutoTheta 다시 계산할 때만 (서비스는 미리 계산한 파일을 읽음). Apache-2.0
forecast-stats = [
    "statsforecast>=2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planetarium-firms-backend"
version = "0.1.0"
description = "FIRMS 1 km harmonization and forecasting backend integration"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["firms_backend", "firms_backend.converter", "firms_backend.forecasting"]
package-dir = { firms_backend = "." }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
firms_backend = ["release-manifest.json"]
"firms_backend.converter" = ["global/*.joblib"]
